group = com.github.jpmand.openproject.idea
version = 0.0.1

pluginRepositoryUrl = https://github.com/JpMand/openproject-idea-integration

# IntelliJ IDEA version to compile and test against.
# Use e.g. -PplatformVersion=2026.1.5.1 or -PplatformVersion=2026.3 to build and test against another release.
platformVersion = 2026.2.3

# Oldest supported IDE build (2026.1). There is no until-build: newer releases are not excluded.
pluginSinceBuild = 261

# "Issue Trackers" (com.intellij.tasks) is bundled up to 2026.1 and published per IDE branch since 2026.2; the build
# picks the one matching platformVersion. Override with -PtasksPluginVersion=<version> if needed.
tasksPluginVersion.262 = 262.8665.173
tasksPluginVersion.263 = 263.7307.108

# IDEs checked by the Plugin Verifier (comma-separated): the latest release of each supported branch.
pluginVerificationIdes = 2026.1.5.1,2026.2.4,2026.3

# OpenProject Docker image used by the integration tests (see scripts/openproject-it.sh).
openprojectImage = openproject/openproject:17

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
